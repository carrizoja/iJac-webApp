name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    env:
      PUBLIC_FIREBASE_API_KEY: ci-firebase-web-api-key
      PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.test
      PUBLIC_FIREBASE_PROJECT_ID: ci-firebase-project
      PUBLIC_FIREBASE_APP_ID: ci-firebase-web-app
      PUBLIC_API_URL: https://api.example.test/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
